<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device add-to-cart-button1.0">
    <title>Product Showcase</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Header Section -->
    <header class="header">
        <h1>Our Products</h1>
    </header>

    <!-- Main Section with Product Cards -->
    <main class="product-container">
        <div class="product-card">
            <img src="https://images.philips.com/is/image/philipsconsumer/5a05b63f545147ec9a3ab11c002a38f6?wid=700&hei=700&$pnglarge$" alt="Product 1">
            <h2 class="product-name">Wireless Headphones</h2>
            <p class="product-price">R500</p>
            <button class="add-to-cart-button">Add to Cart</button>
        </div>
        <div class="product-card">
            <img src="https://cosmotogether.com/cdn/shop/files/1_be07070d-09c1-4bda-828d-482d14f28d53_2048x2048.jpg?v=1747930160" alt="Product 2">
            <h2 class="product-name">Smart Watch</h2>
            <p class="product-price">R1 150</p>
            <button class="add-to-cart-button">Add to Cart</button>
        </div>
        <div class="product-card">
            <img src="https://newworld.co.za/cdn/shop/files/ESX540.jpg?v=1725984291" alt="Product 3">
            <h2 class="product-name">Bluetooth Speaker</h2>
            <p class="product-price">R550</p>
            <button class="add-to-cart-button">Add to Cart</button>
        </div>
        <div class="product-card">
            <img src="https://hniesfp.imgix.net/8/images/detailed/312/AALNBS-SGR_1.jpg?fit=fill&bg=0FFF&w=1500&h=1000&auto=format,compress" alt="Product 4">
            <h2 class="product-name">Laptop Stand</h2>
            <p class="product-price">R350</p>
            <button class="add-to-cart-button">Add to Cart</button>
        </div>
        <div class="product-card">
            <img src="https://www.digicape.co.za/image/cache/catalog/product/HD4006GL/HD4006GL-0-1000x1000.jpg" alt="Product 5">
            <h2 class="product-name">USB-C Hub</h2>
            <p class="product-price">R200</p>
            <button class="add-to-cart-button">Add to Cart</button>
        </div>
        <div class="product-card">
            <img src="https://www.geewiz.co.za/252045-large_default/redragon-m991-enlightenment-19000-dpi-wireless-gaming-mouse-black.jpg" alt="Product 6">
            <h2 class="product-name">Wireless Mouse</h2>
            <p class="product-price">R190</p>
            <button class="add-to-cart-button">Add to Cart</button>
        </div>
    </main>
</body>
</html>
